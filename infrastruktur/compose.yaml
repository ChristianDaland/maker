# Felles tjenester for verkstedet.
# Kjører likt på EliteBooken (amd64) og pi-sentral (Raspberry Pi 5, arm64).
#
#   ./lag-env.sh            # første gang: lager .env med tilfeldige passord
#   docker compose up -d    # start alt
#   docker compose ps       # status
#   docker compose logs -f telegraf
#   docker compose down     # stopp (data beholdes i Docker-volumer)
#
# Dataflyt: ESP32 -> Mosquitto -> Telegraf -> InfluxDB -> Grafana
#                         \-> Node-RED (logikk, varsler)

name: maker

services:
  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "1883:1883"
    environment:
      MQTT_BRUKER: ${MQTT_BRUKER}
      MQTT_PASSORD: ${MQTT_PASSORD}
    # Passordfila lages på nytt fra .env ved hver oppstart
    command: >
      sh -c 'mosquitto_passwd -c -b /mosquitto/data/passwd "$$MQTT_BRUKER" "$$MQTT_PASSORD" &&
             chown mosquitto:mosquitto /mosquitto/data/passwd &&
             chmod 0700 /mosquitto/data/passwd &&
             exec mosquitto -c /mosquitto/config/mosquitto.conf'
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data

  influxdb:
    image: influxdb:2.7
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUX_BRUKER}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_PASSORD}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUX_ORG}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUX_BUCKET}
      DOCKER_INFLUXDB_INIT_RETENTION: ${INFLUX_LAGRINGSTID}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_TOKEN}
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - influxdb-config:/etc/influxdb2

  telegraf:
    image: telegraf:1.37
    restart: unless-stopped
    depends_on: [mosquitto, influxdb]
    environment:
      MQTT_BRUKER: ${MQTT_BRUKER}
      MQTT_PASSORD: ${MQTT_PASSORD}
      INFLUX_TOKEN: ${INFLUX_TOKEN}
      INFLUX_ORG: ${INFLUX_ORG}
      INFLUX_BUCKET: ${INFLUX_BUCKET}
    volumes:
      - ./telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro

  grafana:
    image: grafana/grafana:12.3.0
    restart: unless-stopped
    depends_on: [influxdb]
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_BRUKER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSORD}
      GF_USERS_DEFAULT_LANGUAGE: nb-NO
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      INFLUX_TOKEN: ${INFLUX_TOKEN}
      INFLUX_ORG: ${INFLUX_ORG}
      INFLUX_BUCKET: ${INFLUX_BUCKET}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana

  nodered:
    image: nodered/node-red:4.1
    restart: unless-stopped
    depends_on: [mosquitto]
    ports:
      - "1880:1880"
    environment:
      TZ: Europe/Oslo
      NODERED_BRUKER: ${NODERED_BRUKER}
      NODERED_PASSORD: ${NODERED_PASSORD}
      NODERED_KRYPTERINGSNOKKEL: ${NODERED_KRYPTERINGSNOKKEL}
      MQTT_BRUKER: ${MQTT_BRUKER}
      MQTT_PASSORD: ${MQTT_PASSORD}
    volumes:
      - nodered-data:/data
      - ./nodered/settings.js:/data/settings.js:ro

volumes:
  mosquitto-data:
  influxdb-data:
  influxdb-config:
  grafana-data:
  nodered-data:
