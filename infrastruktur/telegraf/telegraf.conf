# Telegraf – flytter målinger fra MQTT til InfluxDB.
#
# Emnet maker/<sted>/<enhet>/<navn> blir:
#   measurement = <navn>   (f.eks. temperatur)
#   tagger      = sted, enhet
#   felt        = verdi    (tall hvis mulig, ellers tekst)

[agent]
  interval = "10s"
  flush_interval = "5s"
  omit_hostname = true
  skip_processors_after_aggregators = true

[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["maker/+/+/+"]
  username = "${MQTT_BRUKER}"
  password = "${MQTT_PASSORD}"
  client_id = "telegraf"
  # Prøv på nytt hvis Mosquitto ikke er oppe ennå, i stedet for å avslutte
  startup_error_behavior = "retry"
  qos = 0
  data_format = "value"
  data_type = "auto_float"
  value_field_name = "verdi"
  topic_tag = ""

  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "maker/+/+/+"
    measurement = "_/_/_/measurement"
    tags = "_/sted/enhet/_"

[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "${INFLUX_TOKEN}"
  organization = "${INFLUX_ORG}"
  bucket = "${INFLUX_BUCKET}"
