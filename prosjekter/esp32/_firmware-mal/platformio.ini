; Firmware-mal for ESP32-prosjekter i verkstedet.
; Kopieres til firmware/ av verktoy/nytt-prosjekt.sh.
;
; Bygg og last opp:   pio run -t upload
; Seriell monitor:    pio device monitor

[platformio]
default_envs = cyd

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; 1,9 MB til program (standard er 1,25 MB), og plass til oppdatering over Wi-Fi (OTA)
board_build.partitions = min_spiffs.csv
; Felles kode i ~/maker/bibliotek/esp32 (maker_nett, cyd)
lib_extra_dirs = ${PROJECT_DIR}/../../../../bibliotek/esp32
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.4

; ESP32-2432S028R «Cheap Yellow Display»
[env:cyd]
board = esp32dev
upload_speed = 921600
lib_deps =
    ${env.lib_deps}
    lovyan03/LovyanGFX@^1.2.7
build_flags =
    -DMED_SKJERM
    ; -DCYD_ST7789   ; for kort med ST7789-skjerm (ofte de med to USB-porter)

; Simulering i Wokwi (VS Code): samme som cyd, men med Wokwis virtuelle Wi-Fi
; og MQTT mot PC-en (host.wokwi.internal). Berøring finnes ikke i simulatoren.
[env:wokwi]
extends = env:cyd
build_flags =
    ${env:cyd.build_flags}
    -DWOKWI

; Vanlig ESP32 uten skjerm (DevKit / WROOM-32)
[env:esp32dev]
board = esp32dev
; Skjermbiblioteket trengs ikke uten skjerm
lib_ignore = cyd, LovyanGFX
